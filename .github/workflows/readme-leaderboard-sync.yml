name: README Leaderboard Sync

on:
  workflow_run:
    workflows:
      - Optimize Scheduled
      - Optimize Dispatch
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-readme:
    if: github.repository == 'uwplasma/PIC_AGENTIC_WORKFLOW' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    env:
      AUTOMERGE_GH_TOKEN: ${{ secrets.AUTOMERGE_GITHUB_TOKEN }}
    steps:
      - name: Checkout main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0

      - name: Sync public optimization assets from agent-state
        id: sync
        run: |
          set -euo pipefail
          git fetch origin agent-state
          git show origin/agent-state:README.md > /tmp/agent-state-README.md
          cp /tmp/agent-state-README.md README.md
          mkdir -p reports/readme_assets
          if git cat-file -e origin/agent-state:reports/agent_reasoning.md 2>/dev/null; then
            git show origin/agent-state:reports/agent_reasoning.md > reports/agent_reasoning.md
          fi
          if git cat-file -e origin/agent-state:reports/latest_summary.md 2>/dev/null; then
            git show origin/agent-state:reports/latest_summary.md > reports/latest_summary.md
          fi
          rm -rf reports/readme_assets/*
          git checkout origin/agent-state -- reports/readme_assets 2>/dev/null || true
          if git diff --quiet -- README.md reports/latest_summary.md reports/agent_reasoning.md reports/readme_assets; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit sync branch
        if: steps.sync.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git checkout -B automation/readme-leaderboard-sync
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add README.md reports/latest_summary.md reports/agent_reasoning.md reports/readme_assets
          git commit -m "Sync optimization leaderboard and movies from agent-state"
          git push --force origin automation/readme-leaderboard-sync

      - name: Create or reuse PR
        if: steps.sync.outputs.changed == 'true' && env.AUTOMERGE_GH_TOKEN != ''
        id: pr
        env:
          GH_TOKEN: ${{ env.AUTOMERGE_GH_TOKEN }}
        run: |
          set -euo pipefail
          existing_number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head automation/readme-leaderboard-sync --base main --json number --jq '.[0].number // ""')
          if [ -n "$existing_number" ]; then
            echo "number=$existing_number" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          new_pr_url=$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head automation/readme-leaderboard-sync \
            --title "Sync optimization leaderboard and movies from agent-state" \
            --body "Automated public sync from the latest optimization state on the agent-state branch, including leaderboard GIFs and optimizer reasoning.")
          new_number=${new_pr_url##*/}
          echo "number=$new_number" >> "$GITHUB_OUTPUT"

      - name: Merge README sync PR with maintainer token
        if: steps.sync.outputs.changed == 'true' && steps.pr.outputs.number != '' && env.AUTOMERGE_GH_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.AUTOMERGE_GH_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --delete-branch --admin

      - name: Report missing auto-merge token
        if: steps.sync.outputs.changed == 'true' && env.AUTOMERGE_GH_TOKEN == ''
        run: |
          echo "AUTOMERGE_GITHUB_TOKEN is not configured, so the README sync PR cannot be created or auto-merged yet."