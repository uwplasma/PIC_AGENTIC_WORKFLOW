name: Optimize Scheduled

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pic-agentic-workflow-optimization
  cancel-in-progress: false

jobs:
  optimize:
    if: github.repository == 'uwplasma/PIC_AGENTIC_WORKFLOW' && github.ref == 'refs/heads/main'
    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - uwplasma
      - macmini
    timeout-minutes: 60
    env:
      MPLBACKEND: Agg
      RUNNER_TOOL_CACHE: ${{ github.workspace }}/.runner-tool-cache
      AGENT_TOOLSDIRECTORY: ${{ github.workspace }}/.runner-tool-cache
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Prepare local Python tool cache
        run: |
          mkdir -p "$RUNNER_TOOL_CACHE"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run bounded scheduled campaign
        run: python scripts/run_campaign.py --num-trials 1 --seed 1701

      - name: Upload optimization artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: optimize-scheduled-artifacts
          path: |
            reports/
            results/
            state/

      - name: Publish state branch
        run: |
          set -euo pipefail
          git fetch origin agent-state:agent-state || true
          rm -rf .agent-state
          if git show-ref --verify --quiet refs/heads/agent-state; then
            git worktree add .agent-state agent-state
          else
            git worktree add --detach .agent-state
            cd .agent-state
            git checkout --orphan agent-state
            git rm -rf . >/dev/null 2>&1 || true
            cd ..
          fi
          python scripts/push_state_branch.py --source-root "$PWD" --target-root "$PWD/.agent-state"
          cd .agent-state
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add state reports results README.md
          if git diff --cached --quiet; then
            echo "No state changes to push."
            exit 0
          fi
          git commit -m "Scheduled optimization state update ${GITHUB_RUN_ID}"
          git push origin agent-state
