name: Optimize Scheduled

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pic-agentic-workflow-optimization
  cancel-in-progress: false

jobs:
  optimize:
    if: github.repository == 'uwplasma/PIC_AGENTIC_WORKFLOW' && github.ref == 'refs/heads/main'
    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - uwplasma
      - macmini
    timeout-minutes: 60
    env:
      MPLBACKEND: Agg
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Set up local virtual environment
        run: |
          python3 --version
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip

      - name: Restore latest optimizer state from agent-state
        run: |
          set -euo pipefail
          git worktree remove --force .agent-state-restore || true
          git fetch origin agent-state:agent-state || true
          rm -rf .agent-state-restore
          if git show-ref --verify --quiet refs/heads/agent-state; then
            git worktree add .agent-state-restore agent-state
            .venv/bin/python scripts/restore_state_branch.py --source-root "$PWD/.agent-state-restore" --target-root "$PWD"
            git worktree remove --force .agent-state-restore
          else
            echo "No agent-state branch available yet; starting from repository state."
          fi

      - name: Install dependencies
        run: |
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m pip install -e .

      - name: Run bounded scheduled campaign
        run: .venv/bin/python scripts/run_campaign.py --seed 1701

      - name: Upload optimization artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: optimize-scheduled-artifacts
          path: |
            reports/
            results/
            state/

      - name: Publish state branch
        run: |
          set -euo pipefail
          git worktree remove --force .agent-state-restore || true
          git fetch origin agent-state:agent-state || true
          rm -rf .agent-state
          if git show-ref --verify --quiet refs/heads/agent-state; then
            git worktree add .agent-state agent-state
          else
            git worktree add --detach .agent-state
            cd .agent-state
            git checkout --orphan agent-state
            git rm -rf . >/dev/null 2>&1 || true
            cd ..
          fi
          .venv/bin/python scripts/push_state_branch.py --source-root "$PWD" --target-root "$PWD/.agent-state"
          cd .agent-state
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add state reports results README.md
          if git diff --cached --quiet; then
            echo "No state changes to push."
            exit 0
          fi
          git commit -m "Scheduled optimization state update ${GITHUB_RUN_ID}"
          git push origin agent-state
          git worktree remove --force .agent-state
