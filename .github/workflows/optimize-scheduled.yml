name: Optimize Scheduled

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pic-agentic-workflow-optimization
  cancel-in-progress: false

jobs:
  optimize:
    if: github.repository == 'uwplasma/PIC_AGENTIC_WORKFLOW' && github.ref == 'refs/heads/main'
    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - uwplasma
      - macmini
    timeout-minutes: 180
    env:
      MPLBACKEND: Agg
      AUTOMERGE_GH_TOKEN: ${{ secrets.AUTOMERGE_GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up local virtual environment
        run: |
          python3 --version
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m pip install -e .

      - name: Run bounded scheduled campaign
        run: .venv/bin/python scripts/run_campaign.py --num-trials 1 --seed 1701

      - name: Upload optimization artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: optimize-scheduled-artifacts
          path: |
            reports/
            results/
            state/

      - name: Commit and push main
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add state reports results README.md
          if git diff --cached --quiet; then
            echo "No campaign changes to push."
            exit 0
          fi
          git commit -m "Scheduled optimization update ${GITHUB_RUN_ID}"
          if [ -n "${AUTOMERGE_GH_TOKEN:-}" ]; then
            git remote set-url origin "https://x-access-token:${AUTOMERGE_GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git config --unset-all http.https://github.com/.extraheader || true
          fi
          git pull --rebase origin main
          git push origin HEAD:main
