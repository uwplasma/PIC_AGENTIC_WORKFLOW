name: Optimize Scheduled

on:
  schedule:
    - cron: "30 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pic-agentic-workflow-optimization
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run bounded scheduled campaign
        run: python scripts/run_campaign.py --num-trials 2 --seed 1701

      - name: Upload optimization artifacts
        uses: actions/upload-artifact@v4
        with:
          name: optimize-scheduled-artifacts
          path: |
            reports/
            results/
            state/

      - name: Publish state branch
        run: |
          set -euo pipefail
          git fetch origin agent-state:agent-state || true
          rm -rf .agent-state
          if git show-ref --verify --quiet refs/heads/agent-state; then
            git worktree add .agent-state agent-state
          else
            git worktree add --detach .agent-state
            cd .agent-state
            git checkout --orphan agent-state
            git rm -rf . >/dev/null 2>&1 || true
            cd ..
          fi
          python scripts/push_state_branch.py --source-root "$PWD" --target-root "$PWD/.agent-state"
          cd .agent-state
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add state reports results README.md
          if git diff --cached --quiet; then
            echo "No state changes to push."
            exit 0
          fi
          git commit -m "Scheduled optimization state update ${GITHUB_RUN_ID}"
          git push origin agent-state
