name: Copilot Auto Merge

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  pull-requests: write

jobs:
  arm-automerge:
    if: github.event_name == 'pull_request_target' && github.repository == 'uwplasma/PIC_AGENTIC_WORKFLOW' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    outputs:
      trusted: ${{ steps.policy.outputs.trusted }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Evaluate trusted Copilot PR policy
        id: policy
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          config = tomllib.loads(Path('agent/policies/automerge.toml').read_text(encoding='utf-8'))
          trusted_authors = set(config['trusted_authors'])
          required_pr_body_phrase = config['required_pr_body_phrase']
          required_base_branch = config['required_base_branch']

          trusted = (
              os.environ['PR_AUTHOR'] in trusted_authors
              and os.environ['PR_BASE'] == required_base_branch
              and required_pr_body_phrase in os.environ['PR_BODY']
          )

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f"trusted={str(trusted).lower()}\n")
          PY

      - name: Approve Copilot PR
        if: steps.policy.outputs.trusted == 'true' && secrets.AUTOMERGE_GITHUB_TOKEN != ''
        env:
          # Use the built-in GITHUB_TOKEN (github-actions[bot]) to approve.
          # The PR was created by the Copilot bot; using a separate identity
          # avoids any "cannot approve own pull request" errors if the same
          # PAT were used for both approval and creation.
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh pr review "$PR_NUMBER" --repo "$REPOSITORY" --approve

      - name: Enable auto-merge for Copilot PR
        if: steps.policy.outputs.trusted == 'true' && secrets.AUTOMERGE_GITHUB_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh pr merge "$PR_NUMBER" --repo "$REPOSITORY" --auto --squash --delete-branch

      - name: Report missing auto-merge token
        if: steps.policy.outputs.trusted == 'true' && secrets.AUTOMERGE_GITHUB_TOKEN == ''
        run: |
          echo "AUTOMERGE_GITHUB_TOKEN is not configured, so trusted Copilot PRs cannot auto-merge yet."