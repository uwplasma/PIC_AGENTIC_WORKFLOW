name: GitHub Copilot Maintenance

on:
  schedule:
    - cron: "0 15 * * 5"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  maintenance:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run bounded maintenance checks
        run: |
          pytest -q tests/test_mutate_input.py tests/test_scoring.py tests/test_optimizer_state.py tests/test_optimizer_loop.py

      - name: Upload maintenance prompt
        uses: actions/upload-artifact@v4
        with:
          name: maintenance-prompt
          path: agent/prompts/maintenance.md

      - name: GitHub Copilot integration placeholder
        run: |
          echo "Maintenance checks completed."
          echo "If your organization enables GitHub-native Copilot coding automation, wire that PR-first step here."
          echo "Keep the behavior draft-PR-only and never merge directly to main."
