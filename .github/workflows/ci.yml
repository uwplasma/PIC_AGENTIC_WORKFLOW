name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-smoke:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run tests
        run: pytest -q

      - name: Switch to smoke config
        run: cp configs/search_smoke.yaml configs/search.yaml

      - name: Bootstrap state
        run: python scripts/bootstrap_state.py

      - name: Smoke trial
        run: python scripts/run_one_trial.py --drift-multiplier 1.0 --seed 1701

      - name: Upload smoke artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: ci-smoke-artifacts
          path: |
            reports/
            results/
            state/
