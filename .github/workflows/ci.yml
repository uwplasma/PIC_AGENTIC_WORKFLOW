name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-smoke:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run tests
        run: pytest -q

      - name: Switch to smoke config
        run: cp configs/search_smoke.yaml configs/search.yaml

      - name: Bootstrap state
        run: python scripts/bootstrap_state.py

      - name: Smoke trial
        run: python scripts/run_one_trial.py --drift-multiplier 1.0 --seed 1701

      - name: Upload smoke artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-smoke-artifacts
          path: |
            reports/
            results/
            state/
