name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-smoke:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run tests
        run: pytest -q

      - name: Bootstrap state
        run: python scripts/bootstrap_state.py

      - name: Smoke trial
        run: python scripts/run_one_trial.py --drift-multiplier 1.0 --seed 1701

      - name: Upload smoke artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ci-smoke-artifacts
          path: |
            reports/
            results/
            state/
