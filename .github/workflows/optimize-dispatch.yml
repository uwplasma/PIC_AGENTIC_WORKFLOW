name: Optimize Dispatch

on:
  workflow_dispatch:
    inputs:
      num_trials:
        description: Number of new trials to run
        required: true
        default: "2"
      seed:
        description: Optional integer seed override
        required: false
        default: "1701"
      drift_range:
        description: Optional lower,upper override for drift multiplier range
        required: false
        default: ""
      push_state_branch:
        description: Copy generated state to the agent-state branch
        required: true
        default: "true"

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.parse.outputs.allowed }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install parser dependency
        run: |
          python -m pip install --upgrade pip
          pip install PyYAML

      - name: Validate dispatch actor allowlist
        id: parse
        env:
          ACTOR: ${{ github.actor }}
        run: |
          python - <<'PY'
          import os
          import sys
          import yaml
          from pathlib import Path

          policy = yaml.safe_load(Path('agent/policies/actors.yaml').read_text(encoding='utf-8')) or {}
          allowed_actors = set(policy.get('allowed_actors', []))
          actor = os.environ['ACTOR'].strip()
          allowed = actor in allowed_actors

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f'allowed={str(allowed).lower()}\n')

          if not allowed:
              print(f"Actor '{actor}' is not allowlisted for self-hosted dispatch runs.")
              sys.exit(1)
          PY

  optimize:
    needs: gate
    if: needs.gate.outputs.allowed == 'true'
    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - uwplasma
      - macmini
    timeout-minutes: 60
    env:
      MPLBACKEND: Agg
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Set up local virtual environment
        run: |
          python3 --version
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip

      - name: Restore latest optimizer state from agent-state
        run: |
          set -euo pipefail
          git worktree remove --force .agent-state-restore || true
          git fetch origin agent-state:agent-state || true
          rm -rf .agent-state-restore
          if git show-ref --verify --quiet refs/heads/agent-state; then
            git worktree add .agent-state-restore agent-state
            .venv/bin/python scripts/restore_state_branch.py --source-root "$PWD/.agent-state-restore" --target-root "$PWD"
            git worktree remove --force .agent-state-restore
          else
            echo "No agent-state branch available yet; starting from repository state."
          fi

      - name: Install dependencies
        run: |
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m pip install -e .

      - name: Run campaign
        run: >-
          .venv/bin/python scripts/run_campaign.py
          --num-trials ${{ inputs.num_trials }}
          --seed ${{ inputs.seed }}
          ${{ inputs.drift_range != '' && format('--drift-range {0}', inputs.drift_range) || '' }}

      - name: Upload optimization artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: optimize-dispatch-artifacts
          path: |
            reports/
            results/
            state/

      - name: Prepare state branch worktree
        if: inputs.push_state_branch == 'true'
        run: |
          set -euo pipefail
          git worktree remove --force .agent-state-restore || true
          git fetch origin agent-state:agent-state || true
          rm -rf .agent-state
          if git show-ref --verify --quiet refs/heads/agent-state; then
            git worktree add .agent-state agent-state
          else
            git worktree add --detach .agent-state
            cd .agent-state
            git checkout --orphan agent-state
            git rm -rf . >/dev/null 2>&1 || true
            cd ..
          fi
          .venv/bin/python scripts/push_state_branch.py --source-root "$PWD" --target-root "$PWD/.agent-state"

      - name: Commit and push state branch
        if: inputs.push_state_branch == 'true'
        run: |
          set -euo pipefail
          cd .agent-state
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add state reports results README.md
          if git diff --cached --quiet; then
            echo "No state changes to push."
            exit 0
          fi
          git commit -m "Update campaign state from run ${GITHUB_RUN_ID}"
          git push origin agent-state
          cd ..
          git worktree remove --force .agent-state
